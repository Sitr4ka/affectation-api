spring.application.name=affectPro

# Le client React historique appelle http://localhost/affect-pro/backend/...
# La valeur peut etre surchargee (par exemple SERVER_PORT=8080) si le port 80
# est deja utilise par un autre serveur local.
server.port=${SERVER_PORT:80}

# Charge les variables locales du fichier .env, s'il existe.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (les valeurs peuvent etre surchargees par des variables d'environnement)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:affectpro}
spring.datasource.username=${DB_USERNAME:affectpro}
spring.datasource.password=${DB_PASSWORD:affectpro_dev_password}

# Pratique pour le developpement : Hibernate cree/met a jour les tables des entites.
# A remplacer par des migrations (Flyway ou Liquibase) avant la mise en production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
