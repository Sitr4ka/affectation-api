name: API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: affectpro
          POSTGRES_USER: affectpro
          POSTGRES_PASSWORD: affectpro_dev_password
        options: >-
          --health-cmd "pg_isready -U affectpro -d affectpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: affectpro
      DB_USERNAME: affectpro
      DB_PASSWORD: affectpro_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw verify
      - uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: target/*.jar
          if-no-files-found: error

  publish-image:
    name: Publish Docker image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sitr4ka/affectation-api:latest
            ghcr.io/sitr4ka/affectation-api:${{ github.sha }}
