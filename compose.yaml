services:
  postgres:
    image: postgres:17
    container_name: affectpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-affectpro}
      POSTGRES_USER: ${DB_USERNAME:-affectpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-affectpro_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: affectpro-api
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-affectpro}
      DB_USERNAME: ${DB_USERNAME:-affectpro}
      DB_PASSWORD: ${DB_PASSWORD:-affectpro_dev_password}
      SERVER_PORT: 80
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: