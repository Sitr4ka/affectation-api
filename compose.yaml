services:
  postgres:
    image: postgres:17
    container_name: affectpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-affectpro}
      POSTGRES_USER: ${DB_USERNAME:-affectpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-affectpro_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
